# No production backend deployment configuration exists in this repository yet.
# Keep this workflow intentionally non-deploying until the PROD stack, account,
# IAM role, Cognito IDs, API custom domain and allowed origins are verified.
name: Deploy StudyGrounds PROD backend (not configured)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-not-configured:
    name: Production backend deployment not configured
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Explain disabled deployment
        run: |
          echo "::notice::Production backend deployment is not configured."
          echo "No AWS credentials are loaded and no deployment will run."
          echo "Set up the production SAM stack and credentials before enabling this workflow."
