# Single ordered release pipeline. A push to main always updates backend
# first and verifies the public API before publishing frontend assets.
name: Deploy StudyGrounds PROD (backend then frontend)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: studygrounds-production-release
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend and verify PROD API
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Configure production AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Verify AWS account and production stack
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "248189942252"
          test "$(aws sts get-caller-identity --query Arn --output text | grep -c 'assumed-role/StudyGroundsProductionDeploy/')" -ge 1
          test "$(aws cloudformation describe-stacks --stack-name studygrounds-prod --region us-east-2 --query 'Stacks[0].StackStatus' --output text)" = "CREATE_COMPLETE" ||           test "$(aws cloudformation describe-stacks --stack-name studygrounds-prod --region us-east-2 --query 'Stacks[0].StackStatus' --output text)" = "UPDATE_COMPLETE"
          api_url="$(aws cloudformation describe-stacks --stack-name studygrounds-prod --region us-east-2 --query 'Stacks[0].Outputs[?OutputKey==`ApiBaseUrl`].OutputValue | [0]' --output text)"
          test "$api_url" = "https://vhtlpng5e3.execute-api.us-east-2.amazonaws.com"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v3

      - name: Stage shared Lambda legal guard
        run: python scripts/stage_legal_guard.py

      - name: Build backend
        run: sam build --no-cached --template-file infrastructure/template.yaml

      - name: Deploy existing production backend stack
        shell: bash
        run: |
          set -euo pipefail
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name studygrounds-prod \
            --region us-east-2 \
            --capabilities CAPABILITY_IAM \
            --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-z4bksjkichi5 \
            --s3-prefix "studygrounds-prod/releases/${GITHUB_SHA}" \
            --role-arn arn:aws:iam::248189942252:role/StudyGroundsProdCloudFormationExecutionRole \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EnvironmentName=prod \
              ResourceNamePrefix=studygrounds-prod \
              SiteUrl=https://joinstudygrounds.com \
              "EmailSubjectPrefix=[PROD]" \
              CognitoUserPoolId=us-east-2_450eBSuUP \
              CognitoAppClientId=5s7dcd9viec7heodncol82eqtj \
              AdminEmails=jonathan.feagans@outlook.com \
              CloudFrontOrigin=https://d84l1y8p4kdic.cloudfront.net \
              'AllowedOrigins=http://localhost:8080,https://joinstudygrounds.com,https://www.joinstudygrounds.com,https://prod-preview.joinstudygrounds.com'

      - name: Verify production stack and API
        shell: bash
        run: |
          set -euo pipefail
          stack_status="$(aws cloudformation describe-stacks --stack-name studygrounds-prod --region us-east-2 --query 'Stacks[0].StackStatus' --output text)"
          [[ "$stack_status" == "CREATE_COMPLETE" || "$stack_status" == "UPDATE_COMPLETE" ]]
          api_url="$(aws cloudformation describe-stacks --stack-name studygrounds-prod --region us-east-2 --query 'Stacks[0].Outputs[?OutputKey==`ApiBaseUrl`].OutputValue | [0]' --output text)"
          test "$api_url" = "https://vhtlpng5e3.execute-api.us-east-2.amazonaws.com"
          python - <<'PY'
          import json
          import urllib.request
          url = "https://vhtlpng5e3.execute-api.us-east-2.amazonaws.com/api/public/notes"
          with urllib.request.urlopen(url, timeout=30) as response:
              if response.status != 200:
                  raise RuntimeError(f"Public notes API returned HTTP {response.status}")
              json.load(response)
          print("Production public-notes API smoke test passed.")
          PY

  deploy-frontend:
    name: Deploy frontend to production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build static deployment directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/auth
          cp index.html study-notes.html terms.html privacy.html community-guidelines.html robots.txt sitemap.xml styles.css auth.js legal.js notes.js tabs.js dist/
          cp auth/*.html auth/*.js dist/auth/

          cat > dist/config.js <<'EOF'
          window.BUCKET_URL = "";
          window.BUCKET_NAME = "";

          const APP_CONFIG = {
              cognitoDomain: "https://studygrounds-prod-auth.auth.us-east-2.amazoncognito.com",
              cognitoClientId: "5s7dcd9viec7heodncol82eqtj",
              cognitoRedirectUri: window.location.origin + "/auth/callback.html",
              cognitoLogoutUri: window.location.origin + "/",
              apiBaseUrl: "https://vhtlpng5e3.execute-api.us-east-2.amazonaws.com",
              adminEmails: ["jonathan.feagans@outlook.com"]
          };
          EOF

      - name: Sync frontend to PROD S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync dist/ s3://studygrounds-prod-frontend-248189942252-us-east-1/ \
            --delete \
            --cache-control "public,max-age=300"

      - name: Prevent HTML and config caching
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp dist/index.html s3://studygrounds-prod-frontend-248189942252-us-east-1/index.html \
            --content-type "text/html" \
            --cache-control "no-cache,no-store,must-revalidate"
          aws s3 cp dist/config.js s3://studygrounds-prod-frontend-248189942252-us-east-1/config.js \
            --content-type "application/javascript" \
            --cache-control "no-cache,no-store,must-revalidate"
          aws s3 cp dist/auth/callback.html s3://studygrounds-prod-frontend-248189942252-us-east-1/auth/callback.html \
            --content-type "text/html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate PROD CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2JRRP7BOC2CAU \
            --paths "/*"

