  StudyActivityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/study/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          STUDY_ACTIVITY_TABLE: !Ref StudyActivityTable
          SAVED_NOTES_TABLE: !Ref SavedNotesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PreferencesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StudyActivityTable
        # Annotation creation also saves the source note, atomically.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt SavedNotesTable.Arn
        - DynamoDBReadPolicy:
            TableName: !Ref NotesTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !Sub "${NotesTable.Arn}/index/NoteIdIndex"
      Events:
        StudyDashboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/study
            Method: GET
            PayloadFormatVersion: "2.0"
        NoteProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/study/progress/{noteId}
            Method: PUT
            PayloadFormatVersion: "2.0"
        StartStudySession:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/study/sessions
            Method: POST
            PayloadFormatVersion: "2.0"
        FinishStudySession:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/study/sessions/{sessionId}
            Method: PATCH
            PayloadFormatVersion: "2.0"

        ListPrivateAnnotations:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/study/annotations/{noteId}
            Method: GET
            PayloadFormatVersion: "2.0"
        AddPrivateAnnotation:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/study/annotations/{noteId}
            Method: POST
            PayloadFormatVersion: "2.0"
        DeletePrivateAnnotation:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/study/annotations/{noteId}/{annotationId}
            Method: DELETE
            PayloadFormatVersion: "2.0"

