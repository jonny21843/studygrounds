  PublishNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/publish/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          NOTES_BUCKET: !Ref NotesBucket
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          SECURITY_TABLE: !Ref UserSecurityTable
          PREFERENCES_TABLE: !Ref PreferencesTable
          MAX_DAILY_PUBLISH_ACTIONS: "10"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PreferencesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserSecurityTable
        - DynamoDBWritePolicy:
            TableName: !Ref PreferencesTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
              Resource: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
            - Effect: Allow
              Action:
                - s3:GetObjectTagging
              Resource: !Sub "${NotesBucket.Arn}/*"
      Events:
        PublishNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes/{noteId}/publish
            Method: PATCH
            PayloadFormatVersion: "2.0"

  MalwareScanResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/security/malware_scan_result/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          SECURITY_TABLE: !Ref UserSecurityTable
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          ADMIN_EMAILS: !Ref AdminEmails
          SES_FROM_EMAIL: "StudyGrounds <notifications@joinstudygrounds.com>"
          APP_URL: !Ref SiteUrl
          EMAIL_SUBJECT_PREFIX: !Ref EmailSubjectPrefix
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserSecurityTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminDisableUser
              Resource: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource:
                - !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/joinstudygrounds.com"
                - !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/studygrounds-transactional"
      Events:
        GuardDutyScanResult:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.guardduty
              detail-type:
                - GuardDuty Malware Protection Object Scan Result

