AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless API foundation for StudyGrounds.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  ResourceNamePrefix:
    Type: String
    Default: ""
    Description: Optional explicit resource prefix. Leave blank for the existing DEV stack to preserve generated names; use studygrounds-prod for clean production names.

  SiteUrl:
    Type: String
    Default: https://dev.joinstudygrounds.com

  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:8080,https://dev.joinstudygrounds.com

  EmailSubjectPrefix:
    Type: String
    Default: "[StudyGrounds DEV]"

  CognitoUserPoolId:
    Type: String
    Default: us-east-2_sZ3qWdfwv

  CognitoAppClientId:
    Type: String
    Default: 3t79knetd0pdav5jsso0osfb1e

  AdminEmails:
    Type: String
    Default: jonathan.feagans@outlook.com
    Description: Comma-separated administrator emails allowed to view app analytics.

  CloudFrontOrigin:
    Type: String
    Default: https://d84l1y8p4kdic.cloudfront.net
    Description: Legacy saved deploy parameter; not used during localhost development.

Conditions:
  UseExplicitResourceNames: !Not [!Equals [!Ref ResourceNamePrefix, ""]]

Globals:
  Function:
    Environment:
      Variables:
        LEGAL_PREFERENCES_TABLE: !Ref PreferencesTable
        LEGAL_TERMS_VERSION: "1.0"
        LEGAL_PRIVACY_VERSION: "1.0"

Resources:
  LegalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/legal/
      Handler: app.lambda_handler
      Runtime: python3.12
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          PREFERENCES_TABLE: !Ref PreferencesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PreferencesTable
      Events:
        LegalStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/legal/status
            Method: GET
            PayloadFormatVersion: "2.0"
        LegalAccept:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/legal/accept
            Method: POST
            PayloadFormatVersion: "2.0"

  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !If [UseExplicitResourceNames, !Sub "${ResourceNamePrefix}-notes", !Ref "AWS::NoValue"]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: noteId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: noteId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: NoteIdIndex
          KeySchema:
            - AttributeName: noteId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  FeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !If [UseExplicitResourceNames, !Sub "${ResourceNamePrefix}-feedback", !Ref "AWS::NoValue"]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: feedbackId
          AttributeType: S
      KeySchema:
        - AttributeName: feedbackId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  PreferencesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      TableName: !If [UseExplicitResourceNames, !Sub "${ResourceNamePrefix}-preferences", !Ref "AWS::NoValue"]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  SavedNotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !If [UseExplicitResourceNames, !Sub "${ResourceNamePrefix}-saved-notes", !Ref "AWS::NoValue"]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: noteId
          AttributeType: S
        - AttributeName: savedKey
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: noteId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: SavedAtIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: savedKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  HelpfulVotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !If [UseExplicitResourceNames, !Sub "${ResourceNamePrefix}-helpful-votes", !Ref "AWS::NoValue"]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: noteId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: noteId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  StudyActivityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !If [UseExplicitResourceNames, !Sub "${ResourceNamePrefix}-study-activity", !Ref "AWS::NoValue"]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: recordKey
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: recordKey
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  UserSecurityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !If [UseExplicitResourceNames, !Sub "${ResourceNamePrefix}-security", !Ref "AWS::NoValue"]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ModerationReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !If [UseExplicitResourceNames, !Sub "${ResourceNamePrefix}-moderation", !Ref "AWS::NoValue"]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  NotesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If [UseExplicitResourceNames, !Sub "${ResourceNamePrefix}-uploads-${AWS::AccountId}-${AWS::Region}", !Ref "AWS::NoValue"]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref AllowedOrigins
            AllowedMethods:
              - PUT
              - POST
              - GET
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 300

  GuardDutyMalwareScanRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: malware-protection-plan.guardduty.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StudyGroundsMalwareProtection
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowManagedRuleToSendS3EventsToGuardDuty
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*"
                Condition:
                  StringLike:
                    events:ManagedBy: malware-protection-plan.guardduty.amazonaws.com
              - Sid: AllowGuardDutyToMonitorEventBridgeManagedRule
                Effect: Allow
                Action:
                  - events:DescribeRule
                  - events:ListTargetsByRule
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*"
              - Sid: AllowPostScanTag
                Effect: Allow
                Action:
                  - s3:PutObjectTagging
                  - s3:GetObjectTagging
                  - s3:PutObjectVersionTagging
                  - s3:GetObjectVersionTagging
                Resource: !Sub "${NotesBucket.Arn}/*"
              - Sid: AllowEnableS3EventBridgeEvents
                Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource: !GetAtt NotesBucket.Arn
              - Sid: AllowPutValidationObject
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${NotesBucket.Arn}/malware-protection-resource-validation-object"
              - Sid: AllowCheckBucketOwnership
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt NotesBucket.Arn
              - Sid: AllowMalwareScan
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "${NotesBucket.Arn}/*"

  GuardDutyMalwareProtectionPlan:
    Type: AWS::GuardDuty::MalwareProtectionPlan
    # Role GetAtt already creates the dependency; explicit DependsOn is redundant.
    Properties:
      Role: !GetAtt GuardDutyMalwareScanRole.Arn
      ProtectedResource:
        S3Bucket:
          BucketName: !Ref NotesBucket
          ObjectPrefixes:
            - users/
      Actions:
        Tagging:
          Status: ENABLED
      Tags:
        - Key: Application
          Value: StudyGrounds

  NotesApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      DefaultRouteSettings:
        ThrottlingBurstLimit: 30
        ThrottlingRateLimit: 15
      RouteSettings:
        "POST /api/notes/{noteId}/upload":
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 1
        "POST /api/notes/{noteId}/files":
          ThrottlingBurstLimit: 4
          ThrottlingRateLimit: 2
        "GET /api/public/notes/{noteId}/files/{fileId}/preview":
          ThrottlingBurstLimit: 4
          ThrottlingRateLimit: 2
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}"
              audience:
                - !Ref CognitoAppClientId
        DefaultAuthorizer: CognitoJwtAuthorizer

  FeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/feedback/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          FEEDBACK_TABLE: !Ref FeedbackTable
          ADMIN_EMAILS: !Ref AdminEmails
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PreferencesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedbackTable
      Events:
        SubmitFeedback:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/feedback
            Method: POST
            PayloadFormatVersion: "2.0"
        ListAdminFeedback:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/admin/feedback
            Method: GET
            PayloadFormatVersion: "2.0"
        UpdateAdminFeedback:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/admin/feedback/{feedbackId}
            Method: PATCH
            PayloadFormatVersion: "2.0"

  FeaturedNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/featured/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          PREFERENCES_TABLE: !Ref PreferencesTable
          ADMIN_EMAILS: !Ref AdminEmails
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PreferencesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PreferencesTable
        - DynamoDBReadPolicy:
            TableName: !Ref NotesTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${NotesTable.Arn}/index/NoteIdIndex"
      Events:
        PublicFeatured:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/featured-note
            Method: GET
            PayloadFormatVersion: "2.0"
            Auth: { Authorizer: NONE }
        GetFeaturedDismissal:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/featured-note/dismissal
            Method: GET
            PayloadFormatVersion: "2.0"
        SetFeaturedDismissal:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/featured-note/dismissal
            Method: PUT
            PayloadFormatVersion: "2.0"
        RestoreFeatured:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/featured-note/dismissal
            Method: DELETE
            PayloadFormatVersion: "2.0"
        AdminFeature:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/admin/featured-note
            Method: PUT
            PayloadFormatVersion: "2.0"
        AdminUnfeature:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/admin/featured-note
            Method: DELETE
            PayloadFormatVersion: "2.0"

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/me/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Events:
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/me
            Method: GET
            PayloadFormatVersion: "2.0"

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/profile/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          PREFERENCES_TABLE: !Ref PreferencesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PreferencesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PreferencesTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminUpdateUserAttributes
              Resource: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
      Events:
        GetProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/profile
            Method: GET
            PayloadFormatVersion: "2.0"
        UpdateProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/profile
            Method: PATCH
            PayloadFormatVersion: "2.0"

  AdminAnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/admin/analytics/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          NOTES_BUCKET: !Ref NotesBucket
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          ADMIN_EMAILS: !Ref AdminEmails
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NotesTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
              Resource: "*"
      Events:
        GetAdminAnalytics:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/admin/analytics
            Method: GET
            PayloadFormatVersion: "2.0"

  AdminSecurityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/admin/security/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          SECURITY_TABLE: !Ref UserSecurityTable
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          ADMIN_EMAILS: !Ref AdminEmails
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PreferencesTable
        - DynamoDBReadPolicy:
            TableName: !Ref NotesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserSecurityTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminDisableUser
              Resource: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
      Events:
        ListSecurity:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/admin/security
            Method: GET
            PayloadFormatVersion: "2.0"
        GetSecurityUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/admin/security/{userId}
            Method: GET
            PayloadFormatVersion: "2.0"
        UpdateSecurityUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/admin/security/{userId}
            Method: PATCH
            PayloadFormatVersion: "2.0"

  CreateNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/create/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          PREFERENCES_TABLE: !Ref PreferencesTable
          MAX_DAILY_NOTES: "30"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PreferencesTable
        - DynamoDBWritePolicy:
            TableName: !Ref NotesTable
        - DynamoDBWritePolicy:
            TableName: !Ref PreferencesTable
      Events:
        CreateNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes
            Method: POST
            PayloadFormatVersion: "2.0"

  UpdateNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/update/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PreferencesTable
        - DynamoDBWritePolicy:
            TableName: !Ref NotesTable
      Events:
        UpdateNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes/{noteId}
            Method: PATCH
            PayloadFormatVersion: "2.0"

  ListNotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/list/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          NOTES_BUCKET: !Ref NotesBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObjectTagging
              Resource: !Sub "${NotesBucket.Arn}/*"
      Events:
        ListNotes:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes
            Method: GET
            PayloadFormatVersion: "2.0"

  CreateUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/upload/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          NOTES_BUCKET: !Ref NotesBucket
          SECURITY_TABLE: !Ref UserSecurityTable
          MAX_FILE_BYTES: 20971520
          MAX_FILES_PER_NOTE: 10
          MAX_ACCOUNT_STORAGE_BYTES: "1073741824"
          PREFERENCES_TABLE: !Ref PreferencesTable
          MAX_DAILY_UPLOAD_REQUESTS: "30"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PreferencesTable
        - DynamoDBReadPolicy:
            TableName: !Ref NotesTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserSecurityTable
        - DynamoDBWritePolicy:
            TableName: !Ref PreferencesTable
        - S3WritePolicy:
            BucketName: !Ref NotesBucket
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt NotesBucket.Arn
      Events:
        CreateUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes/{noteId}/upload
            Method: POST
            PayloadFormatVersion: "2.0"

  RegisterFileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/files/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          NOTES_BUCKET: !Ref NotesBucket
          SECURITY_TABLE: !Ref UserSecurityTable
          MAX_FILE_BYTES: 20971520
          MAX_FILES_PER_NOTE: 10
          MAX_ACCOUNT_STORAGE_BYTES: "1073741824"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PreferencesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserSecurityTable
        - S3CrudPolicy:
            BucketName: !Ref NotesBucket
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt NotesBucket.Arn
      Events:
        RegisterFile:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes/{noteId}/files
            Method: POST
            PayloadFormatVersion: "2.0"
        UpdateFile:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes/{noteId}/files/{fileId}
            Method: PATCH
            PayloadFormatVersion: "2.0"

  DeleteSourceFileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/delete_file/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          NOTES_BUCKET: !Ref NotesBucket
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PreferencesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
        - S3CrudPolicy:
            BucketName: !Ref NotesBucket
      Events:
        DeleteSourceFile:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes/{noteId}/files/{fileId}
            Method: DELETE
            PayloadFormatVersion: "2.0"

  DeleteNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/delete/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          NOTES_BUCKET: !Ref NotesBucket
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PreferencesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
        - S3CrudPolicy:
            BucketName: !Ref NotesBucket
      Events:
        DeleteNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes/{noteId}
            Method: DELETE
