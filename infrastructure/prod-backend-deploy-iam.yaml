AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Extend the EXISTING StudyGrounds production GitHub role with backend
  permissions and create ONE production CloudFormation service role.
  The existing frontend policy and production application stack are untouched.

Parameters:
  ExistingProductionGithubRoleName:
    Type: String
    Default: StudyGroundsProductionDeploy
    AllowedValues:
      - StudyGroundsProductionDeploy
    Description: Existing OIDC deploy role, not recreated or replaced.
  SamArtifactBucketName:
    Type: String
    Default: aws-sam-cli-managed-default-samclisourcebucket-z4bksjkichi5
    AllowedValues:
      - aws-sam-cli-managed-default-samclisourcebucket-z4bksjkichi5
    Description: Existing account-specific SAM artifact bucket.

Resources:
  ProdBackendExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: StudyGroundsProdCloudFormationExecutionRole
      Description: Execute SAM CloudFormation updates for studygrounds-prod only.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StudyGroundsProdCloudFormationExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ProdLambda
                Effect: Allow
                Action: "lambda:*"
                Resource: !Sub "arn:${AWS::Partition}:lambda:us-east-2:${AWS::AccountId}:function:studygrounds-prod-*"
              - Sid: ProdDynamoDB
                Effect: Allow
                Action: "dynamodb:*"
                Resource:
                  - !Sub "arn:${AWS::Partition}:dynamodb:us-east-2:${AWS::AccountId}:table/studygrounds-prod-*"
                  - !Sub "arn:${AWS::Partition}:dynamodb:us-east-2:${AWS::AccountId}:table/studygrounds-prod-*/index/*"
              - Sid: ProdUploads
                Effect: Allow
                Action: "s3:*"
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::studygrounds-prod-*"
                  - !Sub "arn:${AWS::Partition}:s3:::studygrounds-prod-*/*"
              - Sid: ProdFunctionRoles
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/studygrounds-prod-*"
              - Sid: ProdApiGateway
                Effect: Allow
                Action: "apigateway:*"
                Resource: "*"
              - Sid: ProdGuardDuty
                Effect: Allow
                Action: "guardduty:*"
                Resource: "*"
              - Sid: ServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:us-east-2:aws:transform/Serverless-2016-10-31"
              - Sid: SamArtifactRead
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${SamArtifactBucketName}"
                  - !Sub "arn:${AWS::Partition}:s3:::${SamArtifactBucketName}/*"
              - Sid: ProdEventBridge
                Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:DisableRule
                  - events:EnableRule
                  - events:ListTagsForResource
                  - events:ListTargetsByRule
                  - events:PutRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:TagResource
                  - events:UntagResource
                Resource: !Sub "arn:${AWS::Partition}:events:us-east-2:${AWS::AccountId}:rule/studygrounds-prod-*"

  ExistingProdGithubBackendPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: StudyGroundsProdBackendDeployPolicy
      # AWS::IAM::Policy only adds an inline policy to the existing role.
      # Its frontend policy and OIDC trust remain unchanged.
      Roles:
        - !Ref ExistingProductionGithubRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ExistingProductionStackChanges
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStackEvents
              - cloudformation:ExecuteChangeSet
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
            Resource:
              - !Sub "arn:${AWS::Partition}:cloudformation:us-east-2:${AWS::AccountId}:stack/studygrounds-prod/*"
              - !Sub "arn:${AWS::Partition}:cloudformation:us-east-2:${AWS::AccountId}:changeSet/*/*"
          - Sid: DescribeExistingStacks
            Effect: Allow
            Action:
              - cloudformation:DescribeStackResources
              - cloudformation:DescribeStacks
              - cloudformation:ListStackResources
            Resource: "*"
          - Sid: ExistingSamArtifactBucket
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:ListBucket
            Resource: !Sub "arn:${AWS::Partition}:s3:::${SamArtifactBucketName}"
          - Sid: UploadSamArtifacts
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::${SamArtifactBucketName}/*"
          - Sid: PassOnlyProdExecutionRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt ProdBackendExecutionRole.Arn
            Condition:
              StringEquals:
                "iam:PassedToService": cloudformation.amazonaws.com

Outputs:
  ExistingProductionGithubRoleArn:
    Description: ARN of existing production GitHub OIDC deploy role.
    Value: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ExistingProductionGithubRoleName}"
  CloudFormationExecutionRoleArn:
    Description: ARN to provide to the EXISTING production application stack update.
    Value: !GetAtt ProdBackendExecutionRole.Arn
